<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMEZONE</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">🎮 GAME<span>ZONE</span></div></header><main><section class="hero"><p>موقع ألعابك</p><h1>العب. اكتشف. استمتع.</h1><div class="search">🔎 <input id="search" placeholder="ابحث عن لعبة..."></div></section><section><h2>الألعاب المميزة ⭐</h2><div id="featured" class="grid"></div></section><section><h2>التصنيفات</h2><div id="cats" class="cats"></div></section><section id="games"><h2>أحدث الألعاب</h2><div id="all" class="grid"></div></section></main><script>const games=[{id:1,title:"تفادي السيارات",cat:"سيارات",emoji:"🏎️",type:"dodge",featured:true},{id:2,title:"قفزة النينجا",cat:"مغامرات",emoji:"🥷",type:"jump",featured:true},{id:3,title:"ركلة الهدف",cat:"رياضة",emoji:"⚽",type:"tap",featured:true},{id:4,title:"اختبار السرعة",cat:"ألغاز",emoji:"⚡",type:"reaction",featured:false},{id:5,title:"سباق السرعة",cat:"سيارات",emoji:"🚗",type:"dodge",featured:false},{id:6,title:"محارب الساحة",cat:"أكشن",emoji:"⚔️",type:"reaction",featured:false}];function card(g){return `<article class="card" onclick="location.href='game.html?id=${g.id}'"><div class="thumb">${g.emoji}</div><div class="info"><b>${g.title}</b><span>${g.cat}</span><button>العب الآن</button></div></article>`}function render(a=games){featured.innerHTML=games.filter(x=>x.featured).map(card).join('');all.innerHTML=a.map(card).join('')}cats.innerHTML=[...new Set(games.map(x=>x.cat))].map(c=>`<button onclick="render(games.filter(x=>x.cat==='${c}'))">${c}</button>`).join('');search.oninput=()=>render(games.filter(x=>(x.title+x.cat).toLowerCase().includes(search.value.toLowerCase())));render();</script></body></html>
