<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة - GAMEZONE</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><button onclick="history.back()">←</button><div class="brand">🎮 GAME<span>ZONE</span></div><span></span></header>
<main>
<div id="gameInfo"></div>
<div class="player">
  <canvas id="canvas" width="360" height="520"></canvas>
  <div class="controls"><button id="left">◀</button><button id="start">ابدأ اللعبة</button><button id="right">▶</button></div>
</div>
<section class="description"><h2>كيف تلعب؟</h2><p>اضغط يسار ويمين لتحريك السيارة. تجنب السيارات الحمراء واحصل على أعلى نتيجة.</p></section>
</main>
<script>
const games=[
{id:1,title:"تفادي السيارات",cat:"سيارات",emoji:"🏎️",desc:"قد سيارتك وتفادَ السيارات القادمة."},
{id:2,title:"محارب الساحة",cat:"أكشن",emoji:"⚔️",desc:"هذه اللعبة ستكون قابلة للربط لاحقًا."},
{id:3,title:"ركلة الهدف",cat:"رياضة",emoji:"⚽",desc:"هذه اللعبة ستكون قابلة للربط لاحقًا."}
];
const id=Number(new URLSearchParams(location.search).get("id"))||1;
const g=games.find(x=>x.id===id)||games[0];
gameInfo.innerHTML=`<div class="game-title"><span>${g.emoji}</span><div><h1>${g.title}</h1><small>${g.cat}</small></div></div>`;
const c=document.getElementById("canvas"),ctx=c.getContext("2d");
let car={x:155,y:440,w:50,h:70}, enemies=[],score=0,running=false,over=false,last=0;
function draw(){
ctx.fillStyle="#102126";ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle="#19343b";ctx.fillRect(45,0,270,c.height);
ctx.strokeStyle="#7c969a";ctx.setLineDash([25,25]);ctx.lineWidth=5;ctx.lineDashOffset=-(performance.now()/8%50);
ctx.beginPath();ctx.moveTo(180,0);ctx.lineTo(180,c.height);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle="#16d77c";ctx.fillRect(car.x,car.y,car.w,car.h);
ctx.fillStyle="#04120c";ctx.fillRect(car.x+8,car.y+10,34,18);
enemies.forEach(e=>{ctx.fillStyle="#ef4d55";ctx.fillRect(e.x,e.y,e.w,e.h);});
ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.fillText("النقاط: "+score,12,28);
}
function loop(t){if(!running)return;let dt=Math.min(32,t-last);last=t;
enemies.forEach(e=>e.y+=dt*.25+2); enemies=enemies.filter(e=>e.y<c.height+80);
if(Math.random()<.025) enemies.push({x:55+Math.floor(Math.random()*5)*50,y:-80,w:50,h:70});
enemies.forEach(e=>{if(e.x<car.x+car.w&&e.x+e.w>car.x&&e.y<car.y+car.h&&e.y+e.h>car.y){running=false;alert("انتهت اللعبة! نتيجتك: "+score);}});
score++;draw();requestAnimationFrame(loop)}
function move(d){if(!running)return;car.x=Math.max(50,Math.min(260,car.x+d))}
left.onpointerdown=()=>move(-55);right.onpointerdown=()=>move(55);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-55);if(e.key==="ArrowRight")move(55)});
start.onclick=()=>{car.x=155;enemies=[];score=0;running=true;last=performance.now();requestAnimationFrame(loop)}
draw();
</script>
</body></html>
