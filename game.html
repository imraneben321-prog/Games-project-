<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMEZONE</title><link rel="stylesheet" href="style.css"></head><body><header><button onclick="history.back()">← رجوع</button><div class="brand">🎮 GAME<span>ZONE</span></div></header><main><div id="info"></div><div class="player"><canvas id="c" width="360" height="520"></canvas><div class="controls"><button id="left">◀ يسار</button><button id="start">ابدأ</button><button id="right">يمين ▶</button></div></div><p id="desc"></p></main><script>const gs=[{id:1,title:"تفادي السيارات",cat:"سيارات",emoji:"🏎️",type:"dodge",desc:"تحرك يمينًا ويسارًا وتجنب السيارات."},{id:2,title:"قفزة النينجا",cat:"مغامرات",emoji:"🥷",type:"jump",desc:"اضغط للقفز فوق العقبة."},{id:3,title:"ركلة الهدف",cat:"رياضة",emoji:"⚽",type:"tap",desc:"اضغط داخل المنطقة الخضراء."},{id:4,title:"اختبار السرعة",cat:"ألغاز",emoji:"⚡",type:"reaction",desc:"انتظر الأخضر واضغط بسرعة."},{id:5,title:"سباق السرعة",cat:"سيارات",emoji:"🚗",type:"dodge",desc:"تجنب السيارات وسجل أعلى نتيجة."},{id:6,title:"محارب الساحة",cat:"أكشن",emoji:"⚔️",type:"reaction",desc:"اختبر سرعة رد فعلك."}];const g=gs.find(x=>x.id==Number(new URLSearchParams(location.search).get("id")))||gs[0];info.innerHTML=`<h1>${g.emoji} ${g.title}</h1><small>${g.cat}</small>`;desc.textContent=g.desc;const c=document.getElementById('c'),x=c.getContext('2d');let run=false,score=0,carX=155,en=[],jump=0,vy=0,target=false;function draw(){x.fillStyle='#102126';x.fillRect(0,0,360,520);x.fillStyle='#19343b';x.fillRect(45,0,270,520);if(g.type==='dodge'){x.fillStyle='#16d77c';x.fillRect(carX,440,50,70);en.forEach(e=>{x.fillStyle='#ef4d55';x.fillRect(e.x,e.y,50,70)})}if(g.type==='jump'){x.fillStyle='#173038';x.fillRect(0,430,360,90);x.fillStyle='#16d77c';x.fillRect(70,390-jump,42,42);x.fillStyle='#ef4d55';x.fillRect(285,395,45,45)}if(g.type==='tap'){x.fillStyle='#17d77c';x.fillRect(145,205,70,110);x.fillStyle='#fff';x.beginPath();x.arc(70+(score*4%220),260,24,0,7);x.fill()}if(g.type==='reaction'){x.fillStyle=target?'#17d77c':'#ef4d55';x.beginPath();x.arc(180,260,90,0,7);x.fill()}x.fillStyle='#fff';x.font='bold 18px Arial';x.fillText('النقاط: '+score,12,28)}function loop(){if(!run)return;if(g.type==='dodge'){en.forEach(e=>e.y+=4);en=en.filter(e=>e.y<530);if(Math.random()<.03)en.push({x:55+Math.floor(Math.random()*5)*50,y:-70});for(const e of en)if(e.x<carX+50&&e.x+50>carX&&e.y<510&&e.y+70>440){run=false;alert('انتهت اللعبة! نتيجتك: '+score)}}else if(g.type==='jump'){jump+=vy;vy-=.7;if(jump<0){jump=0;vy=0}}else if(g.type==='reaction'){if(!target&&Math.random()<.02)target=true}score++;draw();requestAnimationFrame(loop)}function move(d){if(run&&g.type==='dodge')carX=Math.max(50,Math.min(260,carX+d))}left.onclick=()=>move(-55);right.onclick=()=>move(55);start.onclick=()=>{run=true;score=0;carX=155;en=[];jump=0;vy=0;target=false;requestAnimationFrame(loop)};c.onpointerdown=()=>{if(!run)return;if(g.type==='jump'&&jump===0)vy=11;else if(g.type==='tap'){let p=70+(score*4%220);score+=(p>145&&p<215)?30:-10}else if(g.type==='reaction'&&target){score+=100;target=false}};document.onkeydown=e=>{if(e.key==='ArrowLeft')move(-55);if(e.key==='ArrowRight')move(55);if(e.code==='Space'&&g.type==='jump'&&jump===0)vy=11};draw();</script></body></html>
